# Builds the app and runs the unit tests on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MonitorInputWizzard.slnx -c Release

      - name: Test
        run: dotnet test MonitorInputWizzard.slnx -c Release --no-build --logger "console;verbosity=normal"
